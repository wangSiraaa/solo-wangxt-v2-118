services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netting
      POSTGRES_USER: netting
      POSTGRES_PASSWORD: netting
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netting -d netting"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/netting
      SPRING_DATASOURCE_USERNAME: netting
      SPRING_DATASOURCE_PASSWORD: netting
      APP_CORS_ORIGINS: http://localhost:4200,http://localhost
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
