spring.application.name=internal-debt-netting

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/netting}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:netting}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:netting}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}
